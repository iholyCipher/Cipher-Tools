[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-tools"
version = "1.0.0"
authors = [
  { name="Cipher Engineering", email="security@ciphertools.org" },
]
description = "⚡ Cipher Tools - Titan Suite: 1,250 Precision Cybersecurity, Forensics, Networking & System Engineering Tools"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
]
keywords = [
    "cybersecurity", "forensics", "networking", "windows-tools",
    "pentest", "net-melli", "sysinternals", "dns-benchmark", "toolkit", "threat-intel"
]

[project.scripts]
cipher-tools = "cipher_tools:main"

[tool.setuptools]
py-modules = ["cipher_tools", "test_suite"]
packages = ["modules"]
