<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Physics Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #080811;
            color: #00ffcc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #topbar {
            width: 100%;
            padding: 12px 25px;
            background: rgba(15, 15, 30, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 255, 204, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00ffcc, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background: #14142b;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            padding: 7px 15px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #00ffcc;
            color: #080811;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        button.active {
            background: #ff007f;
            color: #fff;
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }
        #canvas-wrap {
            position: relative;
            flex: 1;
            width: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info-hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 13px;
            color: #a0aec0;
            background: rgba(10, 10, 25, 0.75);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div id="topbar">
    <div class="title">🌌 ANTIGRAVITY PHYSICS LAB</div>
    <div class="controls">
        <button id="btnGravity" class="active">Gravity: NORMAL (Down)</button>
        <button id="btnVortex">Black Hole Vortex: OFF</button>
        <button id="btnSpawnBalls">Spawn 25 Orbs</button>
        <button id="btnClear">Clear All</button>
    </div>
</div>

<div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="info-hud">
        🖱️ <b>کلیک و کشیدن (Drag):</b> پرتاب ذرات به اطراف<br>
        🎯 <b>کلیک راست:</b> ایجاد گوی فیزیکی جدید در محل نشانگر<br>
        ⚡ تعداد اجسام فعال: <span id="bodyCount" style="color:#00ffcc">0</span>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const bodyCount = document.getElementById('bodyCount');
    const btnGravity = document.getElementById('btnGravity');
    const btnVortex = document.getElementById('btnVortex');
    const btnSpawnBalls = document.getElementById('btnSpawnBalls');
    const btnClear = document.getElementById('btnClear');

    let audioCtx = null;
    function playBounceSound(pitch = 300) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - document.getElementById('topbar').offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gravityModes = ['DOWN', 'ZERO_G', 'INVERTED (UP)'];
    let currentGravIndex = 0;
    let vortexActive = false;

    btnGravity.addEventListener('click', () => {
        currentGravIndex = (currentGravIndex + 1) % gravityModes.length;
        btnGravity.innerText = `Gravity: ${gravityModes[currentGravIndex]}`;
        btnGravity.className = currentGravIndex === 0 ? 'active' : (currentGravIndex === 2 ? 'active' : '');
    });

    btnVortex.addEventListener('click', () => {
        vortexActive = !vortexActive;
        btnVortex.innerText = `Black Hole Vortex: ${vortexActive ? 'ON' : 'OFF'}`;
        btnVortex.className = vortexActive ? 'active' : '';
    });

    btnClear.addEventListener('click', () => {
        particles = [];
        updateCount();
    });

    class Particle {
        constructor(x, y, vx, vy, radius, color) {
            this.x = x;
            this.y = y;
            this.vx = vx || (Math.random() - 0.5) * 6;
            this.vy = vy || (Math.random() - 0.5) * 6;
            this.radius = radius || (Math.random() * 12 + 8);
            this.mass = this.radius;
            this.color = color || `hsl(${Math.random() * 360}, 90%, 60%)`;
            this.history = [];
        }

        update() {
            // Apply Gravity
            if (gravityModes[currentGravIndex] === 'DOWN') {
                this.vy += 0.35;
            } else if (gravityModes[currentGravIndex] === 'INVERTED (UP)') {
                this.vy -= 0.35;
            }

            // Apply Vortex
            if (vortexActive) {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const dx = cx - this.x;
                const dy = cy - this.y;
                const dist = Math.hypot(dx, dy) + 10;
                const force = 400 / (dist * dist);
                this.vx += (dx / dist) * force * 10 - (dy / dist) * 0.4;
                this.vy += (dy / dist) * force * 10 + (dx / dist) * 0.4;
            }

            this.vx *= 0.992; // Air friction
            this.vy *= 0.992;

            this.x += this.vx;
            this.y += this.vy;

            // Bounce Floor & Ceiling
            if (this.y + this.radius > canvas.height) {
                this.y = canvas.height - this.radius;
                this.vy *= -0.75;
                if (Math.abs(this.vy) > 2) playBounceSound(400 - this.radius * 10);
            } else if (this.y - this.radius < 0) {
                this.y = this.radius;
                this.vy *= -0.75;
                if (Math.abs(this.vy) > 2) playBounceSound(400 - this.radius * 10);
            }

            // Bounce Walls
            if (this.x + this.radius > canvas.width) {
                this.x = canvas.width - this.radius;
                this.vx *= -0.75;
                if (Math.abs(this.vx) > 2) playBounceSound(350);
            } else if (this.x - this.radius < 0) {
                this.x = this.radius;
                this.vx *= -0.75;
                if (Math.abs(this.vx) > 2) playBounceSound(350);
            }

            // Trail
            this.history.push({ x: this.x, y: this.y });
            if (this.history.length > 8) this.history.shift();
        }

        draw() {
            // Trail
            if (this.history.length > 1) {
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                for (let i = 1; i < this.history.length; i++) {
                    ctx.lineTo(this.history[i].x, this.history[i].y);
                }
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.25;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            // Glow Body
            ctx.save();
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 12;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    let particles = [];

    function spawnBatch(count = 25) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(
                Math.random() * (canvas.width - 100) + 50,
                Math.random() * (canvas.height / 2) + 50
            ));
        }
        updateCount();
    }
    btnSpawnBalls.addEventListener('click', () => spawnBatch(25));

    function updateCount() {
        bodyCount.innerText = particles.length;
    }

    // Interactive Drag
    let dragTarget = null;
    let mouse = { x: 0, y: 0, px: 0, py: 0, isDown: false };

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
            // Right click: spawn
            particles.push(new Particle(e.clientX, e.clientY - canvas.offsetTop));
            updateCount();
            return;
        }
        mouse.isDown = true;
        const my = e.clientY - canvas.offsetTop;
        particles.forEach(p => {
            if (Math.hypot(p.x - e.clientX, p.y - my) < p.radius * 2) {
                dragTarget = p;
            }
        });
    });

    window.addEventListener('mouseup', () => {
        if (dragTarget) {
            dragTarget.vx = (mouse.x - mouse.px) * 0.7;
            dragTarget.vy = (mouse.y - mouse.py) * 0.7;
            dragTarget = null;
        }
        mouse.isDown = false;
    });

    window.addEventListener('mousemove', (e) => {
        mouse.px = mouse.x;
        mouse.py = mouse.y;
        mouse.x = e.clientX;
        mouse.y = e.clientY - canvas.offsetTop;

        if (dragTarget && mouse.isDown) {
            dragTarget.x = mouse.x;
            dragTarget.y = mouse.y;
            dragTarget.vx = 0;
            dragTarget.vy = 0;
        }
    });

    window.addEventListener('contextmenu', e => e.preventDefault());

    // Resolve Collisions
    function resolveCollisions() {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const p1 = particles[i];
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);

                if (dist < p1.radius + p2.radius) {
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = (p1.radius + p2.radius) - dist;

                    p1.x -= nx * overlap * 0.5;
                    p1.y -= ny * overlap * 0.5;
                    p2.x += nx * overlap * 0.5;
                    p2.y += ny * overlap * 0.5;

                    const kx = p1.vx - p2.vx;
                    const ky = p1.vy - p2.vy;
                    const p = 2 * (nx * kx + ny * ky) / (p1.mass + p2.mass);

                    p1.vx -= p * p2.mass * nx;
                    p1.vy -= p * p2.mass * ny;
                    p2.vx += p * p1.mass * nx;
                    p2.vy += p * p1.mass * ny;
                }
            }
        }
    }

    // Initial spawn
    spawnBatch(30);

    function animate() {
        requestAnimationFrame(animate);
        ctx.fillStyle = 'rgba(8, 8, 17, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw vortex center if active
        if (vortexActive) {
            ctx.save();
            ctx.strokeStyle = '#ff007f';
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff007f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 20 + Math.sin(Date.now() / 150) * 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        resolveCollisions();

        particles.forEach(p => {
            p.update();
            p.draw();
        });
    }

    animate();
</script>
</body>
</html>
